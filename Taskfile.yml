version: "3"

vars:
  CSS_IN: ./assets/app.css
  CSS_OUT: ./staticfs/static/css/app.css
  TAILWIND: node_modules/.bin/tailwindcss
  GALLERY_LOG: /tmp/go-daisy-gallery.log
  GALLERY_PID: /tmp/go-daisy-gallery.pid

tasks:
  build:ui:
    desc: Generate templ files and compile Tailwind CSS
    cmds:
      - ~/go/bin/templ generate ./...
      - "{{.TAILWIND}} -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify"

  generate:
    desc: Regenerate boundarytoken and staticfs codegen (committed alongside sources)
    cmds:
      - go generate ./cmd/gallery/...
      - go generate ./staticfs/...

  build:
    desc: Build UI, regenerate codegen, then go build
    cmds:
      - task: build:ui
      - task: generate
      - go build ./...

  lint:
    desc: Run golangci-lint and guard against daisyUI-4 CSS variables
    cmds:
      - golangci-lint run ./...
      - task: "lint:css"

  "lint:css":
    desc: Guard source CSS and inline styles against daisyUI-4 color variables
    # Limitation: the regex matches only the bare `--X` token inside a var()
    # call with no comma fallback and no surrounding whitespace. It does not
    # catch a `--X,` fallback, a `--X ` trailing space, or a bare `--X:`
    # definition. No such usage exists today; tightening the pattern risks
    # false positives, so the gap is documented rather than closed (see #40).
    # Source scan prunes the generated staticfs/static bundle (and node_modules
    # / .git) by full path, so an unrelated source directory named `static` is
    # still scanned (unlike --exclude-dir, which only matches base names).
    cmds:
      - |
        matches=$(find . \
          -path ./staticfs/static -prune -o \
          -path ./node_modules -prune -o \
          -path ./.git -prune -o \
          -type f \( -name '*.templ' -o -name '*.go' -o -name '*.css' \) \
          ! -name '*_templ.go' \
          -print0 | xargs -0 -r grep -nHE 'var\(--(p|pf|pc|s|sf|sc|a|af|ac|n|nf|nc|b1|b2|b3|bc|in|inc|su|suc|wa|wac|er|erc)\)' || true)
        if [ -n "$matches" ]; then
          printf '%s\n' "$matches"
          echo 'error: daisyUI-4 color variables (--p/--s/--a/--n/--pc/--sc/--ac/--nc/--b1/--b2/--b3/--bc/--in/--su/--wa/--er and their focus/content variants) found in source CSS or inline styles (custom.css, .templ, .go); replace with --color-* (see #40)' >&2
          exit 1
        fi

  gallery:
    desc: Build UI then run gallery interactively (logs to stdout)
    cmds:
      - task: "gallery:stop"
      - task: build:ui
      - go run ./cmd/gallery

  "gallery:start":
    desc: Build UI then start gallery as background daemon
    cmds:
      - task: build:ui
      - task: "gallery:stop"
      - >-
        sh -c 'nohup go run ./cmd/gallery >> {{.GALLERY_LOG}} 2>&1 &
        echo $! > {{.GALLERY_PID}} &&
        echo "gallery started (pid $(cat {{.GALLERY_PID}})), log: {{.GALLERY_LOG}}"'

  "gallery:stop":
    desc: Stop the background gallery daemon
    cmds:
      - >-
        sh -c 'if [ -f {{.GALLERY_PID}} ]; then
        kill $(cat {{.GALLERY_PID}}) 2>/dev/null && echo "gallery stopped" || echo "gallery was not running";
        rm -f {{.GALLERY_PID}};
        else lsof -ti:11000 | xargs kill -9 2>/dev/null || true; fi'

  "gallery:log":
    desc: Tail the gallery daemon log
    cmds:
      - tail -f {{.GALLERY_LOG}}

  "gallery:restart":
    desc: Stop then start the gallery daemon
    cmds:
      - task: "gallery:stop"
      - task: "gallery:start"

  "gallery:dev":
    desc: Run gallery with air (hot reload on .go changes)
    cmds:
      - task: build:ui
      - task: "gallery:stop"
      - air

  dev:ui:
    desc: Watch and recompile CSS
    cmds:
      - "{{.TAILWIND}} -i {{.CSS_IN}} -o {{.CSS_OUT}} --watch"

  "gallery:e2e:start":
    desc: Start gallery on e2e test port
    cmds:
      - task: build:ui
      - task: "gallery:e2e:stop"
      - >-
        sh -c 'GALLERY_PORT=11001 nohup go run ./cmd/gallery > /tmp/go-daisy-e2e.log 2>&1 &
        echo $! > /tmp/go-daisy-e2e.pid &&
        echo "e2e gallery started (pid $(cat /tmp/go-daisy-e2e.pid))"'

  "gallery:e2e:stop":
    desc: Stop e2e gallery
    cmds:
      - >-
        sh -c 'if [ -f /tmp/go-daisy-e2e.pid ]; then
        kill $(cat /tmp/go-daisy-e2e.pid) 2>/dev/null && echo "e2e gallery stopped" || echo "e2e gallery was not running";
        rm -f /tmp/go-daisy-e2e.pid;
        else lsof -ti:11001 | xargs kill -9 2>/dev/null || true; fi'

  "test:e2e":
    desc: Run Playwright E2E tests
    cmds:
      - task: build:ui
      - cd tests/e2e && npm ci
      - cd tests/e2e && npx playwright install chromium 2>/dev/null || true
      - cd tests/e2e && npx playwright test
