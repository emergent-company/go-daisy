name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when tag is set)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag:
        description: Explicit tag (vX.Y.Z); overrides bump
        required: false
        default: ""
      confirm:
        description: dry-run previews; release tags and publishes; backfill publishes an existing tag
        type: choice
        options:
          - dry-run
          - release
          - backfill
        default: dry-run

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate and resolve version
        id: version
        env:
          CONFIRM: ${{ inputs.confirm }}
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/master" ] \
            || { echo "::error::release must be dispatched from master"; exit 1; }
          case "$CONFIRM" in
            dry-run|release|backfill) ;;
            *) echo "::error::confirm must be dry-run, release or backfill"; exit 1 ;;
          esac
          [ -z "$(git status --porcelain)" ] \
            || { echo "::error::working tree is dirty"; exit 1; }
          git fetch origin master --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ] \
            || { echo "::error::HEAD is not origin/master"; exit 1; }

          # Prefer the newest published release reachable from the tag:
          # version order does not follow history here (v0.16.5 is a higher
          # version on an older commit than v0.16.4). Sets `previous`.
          choose_base() {
            local version="$1" base listing_ok=true
            if ! release_candidates="$(gh release list --repo "$GITHUB_REPOSITORY" \
                --limit 100 --exclude-drafts --json tagName \
                --jq '.[] | .tagName' 2>/dev/null)"; then
              listing_ok=false
              release_candidates=""
              echo "::warning::could not list releases; using version order for the notes base"
            fi
            # Candidates are one tag per line; tag names cannot contain spaces.
            if base="$(scripts/release-base.sh "$version" $release_candidates)"; then
              previous="$base"
            elif [ "$listing_ok" = false ]; then
              : # the listing failure already warned
            elif [ -z "$release_candidates" ]; then
              echo "::warning::no published releases found; using version order for the notes base"
            else
              echo "::warning::no published release is reachable from ${version}; using version order for the notes base"
            fi
          }

          tag_exists=false
          if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            tag_exists=true
          fi

          notes_head="HEAD"
          previous=""
          if [ "$CONFIRM" = "backfill" ]; then
            [ -n "$TAG" ] || { echo "::error::backfill requires tag=vX.Y.Z"; exit 1; }
            [ "$tag_exists" = true ] \
              || { echo "::error::tag ${TAG} does not exist; push it first"; exit 1; }
            version="$TAG"
            notes_head="$version"
            previous="$(scripts/release-version.sh --before "$version")"
            choose_base "$version"
          elif [ "$tag_exists" = true ]; then
            # A dry run with an existing tag previews the backfill it would
            # publish; anything else must go through confirm=backfill.
            [ "$CONFIRM" = "dry-run" ] \
              || { echo "::error::tag ${TAG} already exists; use confirm=backfill to publish it"; exit 1; }
            version="$TAG"
            notes_head="$version"
            previous="$(scripts/release-version.sh --before "$version")"
            choose_base "$version"
          else
            if [ -n "$TAG" ]; then
              version="$(scripts/release-version.sh --tag "$TAG")"
            else
              version="$(scripts/release-version.sh --bump "$BUMP")"
            fi
            previous="$(scripts/release-version.sh --current)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "notes_head=$notes_head" >> "$GITHUB_OUTPUT"
          echo "resolved $version (previous $previous, head $notes_head)"

      - name: Render release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_REF: ${{ steps.version.outputs.notes_head }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count "${PREVIOUS}..${HEAD_REF}")" -eq 0 ]; then
            echo "::error::no commits since ${PREVIOUS}; nothing to release"
            exit 1
          fi
          scripts/release-notes.sh "$PREVIOUS" "$HEAD_REF" "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Tag and publish
        if: inputs.confirm == 'release' || inputs.confirm == 'backfill'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" = "backfill" ]; then
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "::error::release ${VERSION} already exists"
              exit 1
            fi
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release-notes.md \
              --verify-tag
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          if ! gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release-notes.md \
              --verify-tag; then
            # 0 = exists, 1 = definitively absent, 2 = unknown (fail safe).
            release_state=2
            if output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" 2>&1)"; then
              release_state=0
            else
              case "$output" in
                *"HTTP 404"*|*"Not Found"*) release_state=1 ;;
                *) release_state=2 ;;
              esac
            fi

            if [ "$release_state" -eq 0 ]; then
              echo "::error::release ${VERSION} exists despite the error; keeping the tag"
              exit 1
            fi
            if [ "$release_state" -eq 2 ]; then
              echo "::error::could not confirm whether ${VERSION} was published; keeping the tag. Check the release page, then retry or delete the tag manually."
              exit 1
            fi

            echo "::warning::deleting orphan tag ${VERSION} so the run can be retried"
            if ! git push origin ":refs/tags/${VERSION}"; then
              echo "::error::could not delete orphan tag ${VERSION}; delete it manually before retrying"
            fi
            exit 1
          fi

      - name: Summary
        if: always() && steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Release ${VERSION} (${CONFIRM}) - ${STATUS}"
            echo
            if [ -f release-notes.md ]; then
              cat release-notes.md
            else
              echo "notes were not generated"
            fi
            if [ "$STATUS" = "success" ]; then
              case "$CONFIRM" in
                dry-run) echo; echo "_Dry run: nothing was published._" ;;
                backfill) echo; echo "_Backfill: no tag was created; only the release was published._" ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"
