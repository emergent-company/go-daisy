name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'galleryruntime/**'
      - 'cmd/gallery/**'
      - 'tests/e2e/**'
      - 'components/**'
      - 'pages/**'
      - 'staticfs/**'
      - 'assets/**'
      - 'webcomponents/**'
      - 'render/**'
      - 'devmode/**'
      - 'shared/**'
      - 'stream/**'
      - 'streamhub/**'
      - 'Taskfile.yml'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'package-lock.json'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright deps
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      # The Playwright global-setup helper builds the gallery binary and starts
      # it on GALLERY_E2E_PORT (default 11001), then waits for /gallery to
      # respond — so no separate background start step is needed here.
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests/e2e
        env:
          GALLERY_E2E_PORT: '11001'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
